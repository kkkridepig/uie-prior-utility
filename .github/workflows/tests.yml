name: CPU tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ppu.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - run: python -m uie smoke --output artifacts/ci_smoke --device cpu
      - run: python -m uie smoke --output artifacts/ci_ddim --device cpu --sampler ddim
